<?xml version="1.0" encoding="UTF-8"?>
<svg width="600" height="200" viewBox="0 0 600 200"
     xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">

  <!-- ===== Background ===== -->
  <rect width="600" height="200" fill="#fff8f0"/>

  <!-- ===== Contribution grid (muted green squares, 6 cols x 4 rows) ===== -->
  <g id="cg" fill="#40c463" opacity="0.22">
    <rect x="4"   y="4"   width="14" height="14" rx="2"/>
    <rect x="22"  y="4"   width="14" height="14" rx="2"/>
    <rect x="40"  y="4"   width="14" height="14" rx="2"/>
    <rect x="58"  y="4"   width="14" height="14" rx="2"/>
    <rect x="76"  y="4"   width="14" height="14" rx="2"/>
    <rect x="94"  y="4"   width="14" height="14" rx="2"/>
    <rect x="112" y="4"   width="14" height="14" rx="2"/>
    <rect x="130" y="4"   width="14" height="14" rx="2"/>
    <rect x="148" y="4"   width="14" height="14" rx="2"/>
    <rect x="166" y="4"   width="14" height="14" rx="2"/>
    <rect x="4"   y="22"  width="14" height="14" rx="2"/>
    <rect x="22"  y="22"  width="14" height="14" rx="2"/>
    <rect x="40"  y="22"  width="14" height="14" rx="2"/>
    <rect x="58"  y="22"  width="14" height="14" rx="2"/>
    <rect x="76"  y="22"  width="14" height="14" rx="2"/>
    <rect x="94"  y="22"  width="14" height="14" rx="2"/>
    <rect x="112" y="22"  width="14" height="14" rx="2"/>
    <rect x="130" y="22"  width="14" height="14" rx="2"/>
    <rect x="148" y="22"  width="14" height="14" rx="2"/>
    <rect x="166" y="22"  width="14" height="14" rx="2"/>
    <rect x="4"   y="40"  width="14" height="14" rx="2"/>
    <rect x="22"  y="40"  width="14" height="14" rx="2"/>
    <rect x="40"  y="40"  width="14" height="14" rx="2"/>
    <rect x="58"  y="40"  width="14" height="14" rx="2"/>
    <rect x="76"  y="40"  width="14" height="14" rx="2"/>
    <rect x="94"  y="40"  width="14" height="14" rx="2"/>
    <rect x="112" y="40"  width="14" height="14" rx="2"/>
    <rect x="130" y="40"  width="14" height="14" rx="2"/>
    <rect x="148" y="40"  width="14" height="14" rx="2"/>
    <rect x="166" y="40"  width="14" height="14" rx="2"/>
  </g>

  <!-- ===== Ground line ===== -->
  <line x1="0" y1="170" x2="600" y2="170" stroke="#e6d9c8" stroke-width="2"/>

  <!-- ===== Trailing thread (behind everything, moves with yarn) ===== -->
  <path id="thread" d="M80,155 Q90,148 100,155" stroke="#ffb6c1" stroke-width="2" fill="none" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 440,0; 440,0"
      keyTimes="0; 0.82; 1"
      dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- ===== Yarn ball ===== -->
  <g id="yarn">
    <!-- core -->
    <circle cx="100" cy="155" r="14" fill="#ffb6c1"/>
    <!-- inner strands -->
    <path d="M88,148 Q100,142 112,148" stroke="#e8829e" stroke-width="1.5" fill="none"/>
    <path d="M87,155 Q100,149 113,155" stroke="#e8829e" stroke-width="1.5" fill="none"/>
    <path d="M88,162 Q100,156 112,162" stroke="#e8829e" stroke-width="1.5" fill="none"/>
    <path d="M94,143 Q100,158 106,143" stroke="#e8829e" stroke-width="1.5" fill="none"/>
    <path d="M94,167 Q100,152 106,167" stroke="#e8829e" stroke-width="1.5" fill="none"/>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 440,0; 440,0"
      keyTimes="0; 0.82; 1"
      dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- ===== Cat ===== -->
  <g id="cat">
    <!-- tail -->
    <path d="M54,155 Q42,138 50,128" stroke="#c2a080" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="36" cy="155" rx="22" ry="14" fill="#d4b896"/>
    <!-- neck -->
    <rect x="16" y="144" width="10" height="10" rx="4" fill="#d4b896"/>
    <!-- head -->
    <circle cx="14" cy="138" r="12" fill="#d4b896"/>
    <!-- left ear -->
    <polygon points="4,130 7,118 14,130" fill="#d4b896"/>
    <polygon points="5.5,129 8,120 13,129" fill="#f0c0b0"/>
    <!-- right ear -->
    <polygon points="14,130 21,118 24,130" fill="#d4b896"/>
    <polygon points="15,129 21,120 22.5,129" fill="#f0c0b0"/>
    <!-- eyes (slightly squinting/chasing look) -->
    <ellipse cx="9"  cy="138" rx="2.5" ry="2" fill="#2a1a0e"/>
    <ellipse cx="19" cy="138" rx="2.5" ry="2" fill="#2a1a0e"/>
    <circle cx="10" cy="137" r="0.8" fill="#fff" opacity="0.7"/>
    <circle cx="20" cy="137" r="0.8" fill="#fff" opacity="0.7"/>
    <!-- nose -->
    <polygon points="13,143 15,143 14,145" fill="#d4748e"/>
    <!-- mouth -->
    <path d="M12,145 Q14,147 16,145" stroke="#a0607e" stroke-width="0.8" fill="none"/>
    <!-- whiskers left -->
    <line x1="7"  y1="143" x2="-4" y2="141" stroke="#9c8070" stroke-width="0.8"/>
    <line x1="7"  y1="144" x2="-4" y2="145" stroke="#9c8070" stroke-width="0.8"/>
    <line x1="7"  y1="145" x2="-4" y2="149" stroke="#9c8070" stroke-width="0.8"/>
    <!-- whiskers right -->
    <line x1="21" y1="143" x2="32" y2="141" stroke="#9c8070" stroke-width="0.8"/>
    <line x1="21" y1="144" x2="32" y2="145" stroke="#9c8070" stroke-width="0.8"/>
    <line x1="21" y1="145" x2="32" y2="149" stroke="#9c8070" stroke-width="0.8"/>
    <!-- front paws (alternating up/down for running look) -->
    <ellipse cx="22" cy="168" rx="7" ry="4" fill="#d4b896"/>
    <ellipse cx="36" cy="169" rx="7" ry="4" fill="#c2a080"/>
    <!-- paw toes -->
    <path d="M17,168 Q19,165 21,168" stroke="#b8967a" stroke-width="0.8" fill="none"/>
    <path d="M31,169 Q33,166 35,169" stroke="#b8967a" stroke-width="0.8" fill="none"/>
    <!-- chase animation: cat starts off-screen left, enters behind the yarn -->
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 440,0; 440,0"
      keyTimes="0; 0.82; 1"
      dur="6s" begin="0.9s" repeatCount="indefinite"/>
  </g>

</svg>
